<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小纤宝 FibroPal · 神经纤维瘤病工作台 · v0.1.19</title>
<link rel="stylesheet" href="style.css?v=7">
<link rel="stylesheet" href="primer.css?v=1">
</head>
<body>
<a class="skip" href="#main">跳到主内容</a>
<aside class="sidebar" aria-label="小纤宝业务导航">
  <div class="brand no-mark"><div><strong>小纤宝</strong><span>FibroPal · 分龄记，瘤体有档</span></div></div>
  <button class="profile profile-btn" id="profile-btn" aria-label="切换演示档案，当前为林小满（妈妈代记）">
    <div class="avatar" id="profile-avatar" aria-hidden="true">满</div>
    <div><b id="profile-name">林小满的资料</b><span id="profile-meta">9 岁 · NF1 · 妈妈代记</span></div>
    <span class="profile-caret" aria-hidden="true">⌄</span>
  </button>
  <nav id="nav" aria-label="一级导航"></nav>
  <div class="sidebar-bottom"><span class="eyebrow">小 X 宝家族</span><p>年龄记清楚，<br>瘤体变化才有档。</p><button class="text-button" data-action="help">原型操作说明 ↗</button></div>
</aside>
<div class="work-area">
  <header class="topbar">
    <div class="breadcrumb">小纤宝工作台 <span>/</span> <b id="breadcrumb">看板</b></div>
    <div class="top-actions">
      <button class="status" id="ready-store" data-action="open-store"><i></i><span>资料目录</span><b>已激活</b></button>
      <button data-action="settings">设置</button>
      <button id="font-toggle" aria-pressed="false" title="切换大字">大字 Aa</button>
      <button class="dp-trigger" data-primer-open aria-label="疾病概要：定义、医学资料与指南情况、治疗全景、发展趋势" title="疾病概要：定义 · 指南 · 治疗全景 · 趋势">?</button>
      <button class="ver-chip" id="ver-chip" data-action="about">v0.1.19</button>
    </div>
  </header>
  <main id="main" tabindex="-1"></main>
  <footer class="foot">小纤宝 FibroPal · 信息整理与就诊准备工具，不提供诊断与治疗建议 · v0.1.19 原型</footer>
</div>
<div id="modal-root" hidden></div>
<script src="demo-data.js"></script>
<script src="app.js"></script>
<!-- 36 号：data 必须先于模块加载 -->
<script src="primer-data.js"></script>
<script src="primer.js"></script>
</body>
</html>
