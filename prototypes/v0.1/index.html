<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小纤宝 FibroPal · 神经纤维瘤病工作台 · v0.1.0</title>
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>
<a class="skip" href="#main">跳到主内容</a>
<aside class="sidebar" aria-label="小纤宝业务导航">
  <div class="brand no-mark"><div><strong>小纤宝</strong><span>FibroPal · 分龄记，瘤体有档</span></div></div>
  <button class="profile profile-btn" id="profile-btn" aria-label="切换演示档案，当前为林小满（妈妈代记）">
    <div class="avatar" id="profile-avatar" aria-hidden="true">满</div>
    <div><b id="profile-name">林小满的资料</b><span id="profile-meta">9 岁 · NF1 · 妈妈代记</span></div>
    <span class="profile-caret" aria-hidden="true">⌄</span>
  </button>
  <nav id="nav" aria-label="一级导航"></nav>
  <div class="sidebar-bottom"><span class="eyebrow">小 X 宝家族</span><p>年龄记清楚，<br>瘤体变化才有档。</p><button class="text-button" data-action="help">原型操作说明 ↗</button></div>
</aside>
<div class="work-area">
  <header class="topbar">
    <div class="breadcrumb">小纤宝工作台 <span>/</span> <b id="breadcrumb">看板</b></div>
    <div class="top-actions">
      <button class="status" id="ready-store" data-action="open-store"><i></i><span>资料目录</span><b>已激活</b></button>
      <button class="status" id="agent-toggle" data-action="agent" aria-expanded="false"><i class="grey"></i><span>AI 对话</span><b id="agent-state">未进入激活</b></button>
      <button data-action="settings">设置</button>
      <button id="font-toggle" aria-pressed="false" title="切换大字">大字 Aa</button>
      <button class="ver-chip" id="ver-chip" data-action="about">v0.1.0</button>
    </div>
  </header>
  <main id="main" tabindex="-1"></main>
  <footer class="foot">小纤宝 FibroPal · 信息整理与就诊准备工具，不提供诊断与治疗建议 · v0.1.0 原型</footer>
</div>
<aside class="agent-dock" id="agent-dock" aria-label="AI 原生会话面板" hidden>
  <div class="agent-head">
    <b>AI 对话</b>
    <div class="agent-sizes">
      <button data-action="agent-size" data-size="narrow" aria-pressed="false" title="窄">窄</button>
      <button data-action="agent-size" data-size="std" aria-pressed="true" title="标准">标准</button>
      <button data-action="agent-size" data-size="wide" aria-pressed="false" title="宽">宽</button>
    </div>
    <button class="icon-button" data-action="agent" aria-label="隐藏 AI 对话面板" title="隐藏">×</button>
  </div>
  <div class="agent-body">
    <p class="agent-hint">右侧为宿主原生会话占位。AI 草稿按钮会把提示词与病情上下文一并带入。</p>
    <div class="agent-carry" hidden></div>
    <button class="primary" data-action="agent-build">让 AI 帮我整理复诊材料（agent-draft）</button>
    <button data-action="agent-demo">看一个 AI 草稿示例</button>
    <p class="agent-hint">AI 输出是草稿与整理建议，不构成诊断或治疗建议；诊疗决定请与医生讨论。</p>
  </div>
</aside>
<div id="modal-root" hidden></div>
<script src="demo-data.js"></script>
<script src="app.js"></script>
</body>
</html>
